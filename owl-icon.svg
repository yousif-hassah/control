<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Black background -->
  <rect width="100" height="100" fill="#000"/>

  <!-- Left eye outer circle -->
  <circle cx="33" cy="44" r="26" fill="#fff"/>
  <!-- Left eye inner black -->
  <circle cx="33" cy="44" r="18" fill="#000"/>
  <!-- Left eye white half-circle (lower) -->
  <path d="M16,50 a17,17 0 0,0 34,0 Z" fill="#fff"/>
  <!-- Left pupil dot -->
  <circle cx="30" cy="49" r="5.5" fill="#000"/>

  <!-- Right eye outer circle -->
  <circle cx="67" cy="44" r="26" fill="#fff"/>
  <!-- Right eye inner black -->
  <circle cx="67" cy="44" r="18" fill="#000"/>
  <!-- Right eye white half-circle (lower) -->
  <path d="M50,50 a17,17 0 0,0 34,0 Z" fill="#fff"/>
  <!-- Right pupil dot -->
  <circle cx="64" cy="49" r="5.5" fill="#000"/>

  <!-- Beak (diamond/arrow down) -->
  <polygon points="50,72 44,64 50,60 56,64" fill="#fff"/>
</svg>
